name: CI backend (deploy)

# Fase 0 del plan de "Bitácora de confianza" -- mismo workflow que el repo
# de desarrollo (horasDedicacionOnline/backendonline2), adaptado a la
# estructura plana de este repo (horasdedica.js en la raiz, sin la carpeta
# backendonline2/). Este repo no recibe PRs de contribuidores (se mergea
# a mano por mirror desde el repo de desarrollo), asi que el valor real
# aca es que Render no despliegue un mirror roto: si algo se copio mal o
# quedo desincronizado al mirrorear, este check lo agarra ANTES del
# deploy en vez de que el primer aviso sea produccion caida.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: horas_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_ADDON_HOST: 127.0.0.1
      MYSQL_ADDON_USER: root
      MYSQL_ADDON_PASSWORD: root
      MYSQL_ADDON_DB: horas_ci
      MYSQL_ADDON_PORT: 3306
      TEST_BASE_URL: http://localhost:3000
      PORT: 3000
      # Site/secret keys de PRUEBA oficiales y publicas de Cloudflare
      # Turnstile ("always passes") -- no son credenciales de nadie.
      TURNSTILE_SECRET_KEY: '1x0000000000000000000000000000000AA'
      # ANTHROPIC_API_KEY y MERCADOPAGO_ACCESS_TOKEN NO se configuran aca a
      # proposito -- los tests que los necesitan se saltan solos.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # La suite hace ~800 pedidos desde una sola IP en pocos minutos: con los
      # limites de produccion (300/min, 60/min en reportes) el backend la
      # frenaba con 429. Solo para el CI; ver limiteDesdeEnv en security.js.
      RATE_LIMIT_POR_MINUTO: 100000
      RATE_LIMIT_REPORTES_POR_MINUTO: 100000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, igual que en desarrollo. Node 20 ya no tiene soporte (GitHub lo
          # avisa en cada corrida).
          node-version: 24

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar cliente de MySQL
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Esperar a que MySQL este listo
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -uroot -proot --silent && break
            sleep 2
          done

      # La estructura sale de schema/estructura_AAAAMMDD.sql (generado con
      # scripts/generar-esquema-ci.sh desde una base con todas las
      # migraciones). Hasta el 2026-09-28 este paso cargaba
      # schema/full_schema_snapshot.sql, que se borro el 2026-09-23 por
      # desactualizado: desde entonces el CI fallaba aca, SIN llegar a correr
      # un solo test (y antes tambien fallaba, por la foto vieja).
      - name: Cargar la estructura de la base y los datos minimos
        run: |
          ESTRUCTURA=$(ls schema/estructura_*.sql | sort | tail -1)
          echo "Estructura: $ESTRUCTURA"
          mysql -h127.0.0.1 -uroot -proot horas_ci < "$ESTRUCTURA"
          mysql -h127.0.0.1 -uroot -proot horas_ci < schema/datos_base_ci.sql

      - name: Aplicar migraciones posteriores a la estructura
        # Solo las de fecha POSTERIOR a la del archivo de estructura: las
        # anteriores ya estan incluidas, y las viejas no se pueden correr dos
        # veces (ALTER TABLE ADD COLUMN sin guarda -> "Duplicate column").
        run: |
          ESTRUCTURA=$(ls schema/estructura_*.sql | sort | tail -1)
          CORTE=$(basename "$ESTRUCTURA" .sql | sed 's/estructura_//')
          for f in migrations/*.sql; do
            base=$(basename "$f")
            case "$base" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_*)
                prefix=${base:0:8}
                if [ "$prefix" -gt "$CORTE" ]; then
                  echo "Aplicando $f"
                  mysql -h127.0.0.1 -uroot -proot horas_ci < "$f"
                fi
                ;;
            esac
          done

      # Hasta el 2026-09-29 este paso esperaba 30 s y seguia igual aunque el
      # backend no hubiera arrancado: la suite fallaba despues sin decir por
      # que. Ahora, si no arranca, falla ACA y publica su log como anotacion
      # (las anotaciones se ven sin iniciar sesion en GitHub).
      - name: Levantar el backend
        run: |
          node horasdedica.js > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/health -o /dev/null && { echo "Backend arriba en ${i}s"; exit 0; }
            sleep 1
          done
          echo "::error title=El backend no arranco en 60 s::$(tail -n 40 server.log | awk 'BEGIN{ORS="%0A"; cr=sprintf("%c",13)} {gsub(/%/,"%25"); gsub(cr,""); print}')"
          exit 1

      # La salida queda en test-output.log para poder resumir las fallas en
      # una anotacion publica (el log completo de Actions pide iniciar sesion).
      - name: Correr la suite completa
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Resumir las fallas como anotaciones
        if: failure()
        run: |
          esc() { awk 'BEGIN{ORS="%0A"; cr=sprintf("%c",13)} {gsub(/%/,"%25"); gsub(cr,""); print}'; }
          if [ -f test-output.log ]; then
            echo "::error title=Resumen de la suite::$(grep -aE '^ℹ (tests|pass|fail|skipped)' test-output.log | esc)"
            echo "::error title=Tests que fallaron::$(grep -aE '^✖' test-output.log | sort -u | head -60 | esc)"
            echo "::error title=Primeros errores::$(grep -aE -A6 '^✖' test-output.log | grep -aE 'Error|expected|actual|ECONN|ER_' | head -40 | esc)"
          fi
          if [ -f server.log ]; then
            echo "::error title=Ultimas lineas del log del backend::$(tail -n 40 server.log | esc)"
          fi

      - name: Mostrar el log del servidor si algo fallo
        if: failure()
        run: cat server.log || true
