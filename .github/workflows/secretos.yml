# Control de secretos (Fase 0 de PLAN_LISTO_PARA_VENDER.md, 2026-10-18).
#
# POR QUE: una contraseña o clave privada subida por error a GitHub queda en
# el historial para siempre, aunque despues se borre el archivo. Este control
# revisa TODO el historial en cada cambio con gitleaks (la herramienta mas
# usada para esto) y falla si aparece algo que no este en .gitleaksignore
# (ahi estan los hallazgos ya revisados, todos publicos por diseño).
# Si falla: NO publicar, revisar el hallazgo y, si es un secreto real,
# cambiar esa clave (rotarla) en el servicio que corresponda.
name: Secretos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # todo el historial, no solo el ultimo commit
      - name: Escanear el historial con gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --exit-code 1
